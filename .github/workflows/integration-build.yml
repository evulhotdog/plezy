# Fork-only workflow: lives on integration/all-features and survives upstream
# merges because upstream will never own this filename. Never PR it upstream.
#
# On every push to integration/all-features: builds the arm64 release APK and
# publishes a GitHub release so Obtainium can track and install it (Obtainium
# picks the latest non-prerelease release and takes the version from the tag).
#
#   - Signing: the fork's ANDROID_KEYSTORE_* secrets hold the standard debug
#     keystore — the same key already trusted on the Shield — so Obtainium
#     updates install in place with no data wipe. A missing secret is a hard
#     failure: signing with a fresh per-run key would strand future updates.
#   - versionCode: max(pubspec build number, Shield's installed code floor)
#     + run number, so it always increases past any build already installed.
#   - Tag: v<pubspec base>.<versionCode>, e.g. v2.19.1.2159.
name: Integration Build

on:
  push:
    branches:
      - integration/all-features
  workflow_dispatch:

concurrency:
  group: integration-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"
  # versionCode floor: Shield's installed com.edde746.plezy versionCode at
  # adoption (read via `adb shell dumpsys package com.edde746.plezy`).
  VERSION_CODE_FLOOR: "2157"

jobs:
  build-android:
    name: Android (arm64) + release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
          key: integration-build-${{ runner.os }}-${{ runner.arch }}-pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: integration-build-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Compute version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_BASE=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          BASE_CODE=$(python3 scripts/pubspec_version.py --build-number pubspec.yaml)
          VERSION_CODE=$(( ( VERSION_CODE_FLOOR > BASE_CODE ? VERSION_CODE_FLOOR : BASE_CODE ) + RUN_NUMBER ))
          echo "VERSION_BASE=$VERSION_BASE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Tag will be v$VERSION_BASE.$VERSION_CODE"

      - name: Configure signing (stable fork key)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing; refusing to sign with a fresh key (it would strand future updates and force a data wipe)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fork-release.keystore
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=fork-release.keystore"
          } > android/key.properties

      - name: Build APK
        # arm64-only: matches the Shield target, ~3x faster than the multi-ABI
        # split the upstream release CI does. Other ABIs compile the same
        # sources and stay covered upstream.
        run: flutter build apk --release --target-platform android-arm64 --build-number="$VERSION_CODE" --dart-define=GIT_COMMIT=${{ github.sha }} --obfuscate --split-debug-info=debug-info/android

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/fork-release.keystore android/key.properties

      - name: Package APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "plezy-arm64-v$VERSION_BASE.$VERSION_CODE.apk"

      - name: Publish release (Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_BASE.$VERSION_CODE"
          gh release create "$TAG" "plezy-arm64-v$VERSION_BASE.$VERSION_CODE.apk" \
            --target "$GITHUB_SHA" \
            --title "Plezy $TAG (integration build)" \
            --notes "Automated integration-branch build of ${GITHUB_SHA::7}. versionCode=$VERSION_CODE" \
            || gh release upload "$TAG" "plezy-arm64-v$VERSION_BASE.$VERSION_CODE.apk" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-android-arm64
          path: |
            plezy-arm64-v*.apk
            debug-info/android/
